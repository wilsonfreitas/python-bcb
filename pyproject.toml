[project]
name = "python-bcb"
version = "0.4.2"
description = "Interface Python para APIs de dados abertos do Banco Central do Brasil."
authors = [{ name = "wilsonfreitas", email = "wilson.freitas@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.10"
keywords = [
    "banco central do brasil",
    "bcb",
    "dados abertos",
    "open data",
    "sgs",
    "odata",
    "ptax",
    "focus",
    "expectativas",
    "ifdata",
    "finance",
    "economics",
    "time series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx >= 0.24.0",
    "lxml >= 4.9.2",
    "pandas >= 2.0.0",
    "tenacity >= 8.0.0",
]

[project.urls]
Homepage = "https://github.com/wilsonfreitas/python-bcb"
Documentation = "https://wilsonfreitas.github.io/python-bcb/"
Repository = "https://github.com/wilsonfreitas/python-bcb"
Issues = "https://github.com/wilsonfreitas/python-bcb/issues"
Changelog = "https://github.com/wilsonfreitas/python-bcb/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest >= 7.1.3",
    "flaky >= 3.7.0",
    "pytest-httpx >= 0.30.0",
]
docs = [
    "matplotlib >= 3.5.3",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
dev = [
    "ruff >= 0.9.0",
    "ipykernel >= 6.15.2",
    "jupyter >= 1.1.1",
    "mypy >= 1.0.0",
    "pytest-cov >= 4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bcb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring live BCB network access (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["bcb"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B904", "B905", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
